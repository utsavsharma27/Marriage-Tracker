<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utsav Wedding Tracker</title>
<style>
  :root { --ink:#1d1d1f; --muted:#6b6b72; --line:#e4e2dc; --bg:#faf9f6; --card:#fff; --accent:#8a3b12; --ok:#1f7a3a; --warn:#b15a00; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#f1efe9; --muted:#a6a39a; --line:#3a3936; --bg:#1b1a18; --card:#25241f; --accent:#f0a46b; --ok:#67c987; --warn:#f0b15a; --bad:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 16px 8px; max-width:1100px; margin:auto; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; }
  main { max-width:1100px; margin:auto; padding:0 16px 40px; }
  .search { display:flex; gap:8px; margin:14px 0 6px; }
  .search input { flex:1; font-size:1.05rem; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 16px; }
  .tab { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 12px; border-radius:999px; cursor:pointer; font-size:.9rem; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; }
  .stat b { display:block; font-size:1.25rem; }
  .stat span { color:var(--muted); font-size:.8rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .card h3 { margin:0 0 6px; font-size:1.05rem; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:3px 10px; margin:6px 0 0; font-size:.88rem; }
  dt { color:var(--muted); }
  dd { margin:0; }
  .chip { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.78rem; border:1px solid var(--line); margin:2px 4px 2px 0; }
  .swatch { display:inline-block; width:12px; height:12px; border-radius:3px; border:1px solid #333; vertical-align:-1px; margin-right:4px; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:rgba(127,127,127,.12); font-weight:600; }
  .table-wrap { overflow-x:auto; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 10px; align-items:center; }
  select, .controls input { padding:7px 9px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:.9rem; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  .muted { color:var(--muted); }
  .section-title { margin:18px 0 8px; font-size:1rem; }
  .empty { color:var(--muted); padding:20px 0; }
  .err { background:#fde8e6; color:#8a1c14; padding:10px 12px; border-radius:10px; margin:10px 0; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:.82rem; color:var(--muted); margin:6px 0 12px; }
  @media (max-width:520px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Utsav Wedding Tracker</h1>
  <div class="sub" id="status">Loading data...</div>
  <div class="search">
    <input id="q" type="search" placeholder="Search a name (e.g. Akash) or room number (e.g. 104)" autocomplete="off">
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-view="find">Find guest / room</button>
    <button class="tab" data-view="shirts">Shirts &amp; sarees</button>
    <button class="tab" data-view="work">Pending work</button>
    <button class="tab" data-view="pay">Payments</button>
    <button class="tab" data-view="exp">Expenses</button>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div id="err"></div>
  <div id="view"></div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
